name: 0 - Agenda (relógio do robô)

# O cron-job.org "toca" este relógio a cada 15 minutos (00, 15, 30, 45) — o agendamento
# do próprio GitHub atrasa horas, por isso não é usado. A cada toque, o relógio olha a hora
# de Brasília e dispara as rotinas daquele quarto de hora.
on:
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar as rotinas deste horário
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          export TZ=America/Sao_Paulo
          H=$(date +%H); M=$(date +%M); DOW=$(date +%u)   # DOW: 1=seg ... 7=dom
          Q=$(( (10#$M / 15) * 15 )); HQ=$(printf '%02d:%02d' $((10#$H)) $Q)
          echo "⏰ Agora: $(date +'%d/%m %H:%M') → quarto de hora $HQ (dia $DOW)"
          WFS="responder.yml"                                        # sempre: respostas EU QUERO (aprovacao.yml entra lá embaixo, nos quartos de hora livres)
          case "$HQ" in 06:45|11:45|17:45) WFS="$WFS garimpo.yml" ;; esac
          # 27/10/2026: carrossel de achados só 1 por dia (alcançava ~5 contas cada; o Reels do Zé alcança ~130).
          # 28/10/2026: quarta e sábado o carrossel das 18:45 vira Kit do Zé (carrossel temático, src/kits.py), ok do Fred
          # 30/10/2026: volta o carrossel das 07:45 (abre com o vídeo do Zé); o das 18:45 abre com a capa de produto
          # e o Zé pequeno embaixo (src/achados.py capa_de_produto), ok do Fred
          # 08/11/2026 (Fred): 1 carrossel por dia de cada loja + 1 geral: 07:45 geral (vídeo do Zé),
          # 12:45 só AliExpress, 16:30 só Shopee, 18:45 só Mercado Livre (qua/sáb o Kit fica às 18:45 e o ML vai às 21:30)
          LOJA=""
          if [ "$HQ" = "07:45" ]; then WFS="$WFS achados.yml"; fi
          if [ "$HQ" = "12:45" ]; then LOJA="aliexpress"; fi
          if [ "$HQ" = "16:30" ]; then LOJA="shopee"; fi
          if [ "$HQ" = "18:45" ]; then
            if [ "$DOW" = "3" ] || [ "$DOW" = "6" ]; then WFS="$WFS kits.yml"; else LOJA="mercadolivre"; fi
          fi
          if [ "$HQ" = "21:30" ] && { [ "$DOW" = "3" ] || [ "$DOW" = "6" ]; }; then LOJA="mercadolivre"; fi
          # 03/11/2026: Kit de Natal TODO DIA às 20:00 (pedido do Fred), só temas de Natal e nunca o mesmo produto
          # (src/kits.py, KIT_MODO=natal). Vai de novembro a 31/12; fora da temporada o kits.yml não posta nada.
          NATAL=""
          MES=$(date +%m)
          if [ "$HQ" = "20:00" ] && { [ "$MES" = "11" ] || [ "$MES" = "12" ]; }; then NATAL=1; fi
          # postar.yml agora só entrega "Você pediu, o Zé achou" e vídeos manuais (não faz nada se não houver)
          case "$HQ" in 10:45|15:45|20:45) WFS="$WFS postar.yml" ;; esac
          if [ "$Q" = "15" ] && [ $((10#$H)) -ge 8 ] && [ $((10#$H)) -le 22 ]; then WFS="$WFS telegram-ofertas.yml"; fi
          case "$HQ" in 00:15|08:15|12:15|18:15) WFS="$WFS campanhas.yml" ;; esac
          case "$HQ" in 09:00|12:00|18:00|20:30) WFS="$WFS whatsapp.yml" ;; esac   # kit do Canal do WhatsApp no seu Telegram privado
          if [ "$HQ" = "19:30" ] && { [ "$DOW" = "2" ] || [ "$DOW" = "5" ]; }; then WFS="$WFS chamada.yml"; fi   # chamada da vitrine da bio (terça e sexta)
          if [ "$HQ" = "08:30" ] && [ "$DOW" = "1" ]; then WFS="$WFS token.yml"; fi
          if [ "$HQ" = "11:30" ]; then WFS="$WFS busca.yml"; fi     # Reels da Busca do Zé: 1x por semana
          if [ "$HQ" = "13:30" ]; then WFS="$WFS ze.yml"; fi        # Reels do Zé Garimpo: todo dia desde 27/10/2026 (ZE_DIAS)
          # Limpeza de posts antigos DESLIGADA (12/10/2026): a legenda já mostra quando o preço foi conferido.
          # Para religar: if [ "$HQ" = "03:15" ]; then WFS="$WFS limpeza.yml"; fi
          if [ "$HQ" = "17:00" ] && [ "$DOW" = "5" ]; then WFS="$WFS revisao.yml"; fi
          if [ "$HQ" = "16:00" ] && { [ "$DOW" = "5" ] || [ "$(date -d tomorrow +%d)" = "01" ]; }; then WFS="$WFS top.yml"; fi   # Top 5: semana (sexta) / mês (último dia)   # revisão semanal no seu Telegram privado
          # Ana Novo Achados (@ananovoachados): LIGADA em 13/10/2026.
          # Para pausar: troque ANA_LIGADA=1 por ANA_LIGADA=0.
          ANA_LIGADA=1
          ANA=""
          # 31/10/2026: Ana em stand-by (decisão do Fred: concentrar no Garimpo). Só 1 carrossel por dia (19:15)
          # e 1 busca de ofertas (17:00); post próprio da Ana (ze.yml) pausado.
          # Para voltar ao normal: busca 06:30|11:30|17:00, carrossel 09:15|14:30|19:15 e descomentar o ze.yml.
          case "$HQ" in 17:00) ANA="$ANA garimpo.yml" ;; esac
          case "$HQ" in 19:15) ANA="$ANA achados.yml" ;; esac
          if [ "$HQ" = "08:45" ] && [ "$DOW" = "1" ]; then ANA="$ANA token.yml"; fi
          # if [ "$HQ" = "16:00" ]; then ANA="$ANA ze.yml"; fi        # post próprio da Ana: terças, quintas e sábados (ANA_DIAS)
          # Posts de marca aprovados pelo Fred (manuais/posts.json), dia e horário combinados (Brasília)
          DATA=$(date +%F); MANUAL=""
          case "$DATA $HQ" in
            "2026-10-24 10:00") MANUAL="ze2:garimpo" ;;
            "2026-10-25 10:00") MANUAL="ana2:ana" ;;
            "2026-10-26 10:00") MANUAL="ze2:garimpo" ;;   # reagendado: falhou 24/10 (erro já corrigido)
            "2026-10-26 10:15") MANUAL="ana2:ana" ;;      # reagendado: falhou 25/10
            "2026-10-27 10:00") MANUAL="ze3:garimpo" ;;
            "2026-10-27 10:15") MANUAL="ana3:ana" ;;
          esac
          # Status do robô todo dia às 08:00 (Brasília), mandado no seu Telegram privado
          if [ "$HQ" = "08:00" ]; then WFS="$WFS revisao.yml"; fi
          for M in $MANUAL; do
            gh api -X POST "repos/$REPO/actions/workflows/publicar-manual.yml/dispatches" -f ref=main -f "inputs[nome]=${M%%:*}" -f "inputs[perfil]=${M##*:}" || echo "::warning::falhou post ${M%%:*}"
          done
          [ "$ANA_LIGADA" = "1" ] || ANA=""
          # Aprovações/direct pelo Telegram (28/10/2026) só nos quartos de hora livres: elas dividem a fila
          # "grava-repositorio" com posts e Telegram, e o GitHub só guarda 1 rotina esperando nessa fila —
          # com 3 juntas, a do meio era cancelada (30/10/2026: 5 rodadas de Ofertas no Telegram perdidas por dia).
          LIVRE=1
          [ -n "$NATAL" ] && LIVRE=0
          [ -n "$LOJA" ] && LIVRE=0
          for WF in $WFS $ANA; do case "$WF" in responder.yml|revisao.yml) ;; *) LIVRE=0 ;; esac; done
          if [ "$LIVRE" = "1" ]; then WFS="$WFS aprovacao.yml"; fi
          for WF in $WFS; do
            echo "▶️  $WF"
            gh api -X POST "repos/$REPO/actions/workflows/$WF/dispatches" -f ref=main || echo "::warning::falhou $WF"
          done
          if [ -n "$LOJA" ]; then
            echo "▶️  achados.yml (loja $LOJA)"
            gh api -X POST "repos/$REPO/actions/workflows/achados.yml/dispatches" -f ref=main -f "inputs[loja]=$LOJA" || echo "::warning::falhou achados.yml ($LOJA)"
          fi
          if [ -n "$NATAL" ]; then
            echo "▶️  kits.yml (natal)"
            gh api -X POST "repos/$REPO/actions/workflows/kits.yml/dispatches" -f ref=main -f "inputs[modo]=natal" || echo "::warning::falhou kits.yml (natal)"
          fi
          # 05/11/2026: estratégia de marketing (src/marketing.py, ok do Fred). Fora da fila "grava-repositorio".
          MKT=""
          if [ "$HQ" = "10:00" ] && { [ "$DOW" = "2" ] || [ "$DOW" = "5" ]; }; then MKT="divulgar"; fi   # texto pronto no seu Telegram privado
          DM=$(date +%m%d)
          if [ "$HQ" = "08:30" ] && [ "$DM" -ge 1112 ] && [ "$DM" -le 1201 ]; then MKT="$MKT lista_black"; fi   # Lista da Black fixada no canal (01/12 desafixa)
          for A in $MKT; do
            echo "▶️  marketing.yml ($A)"
            gh api -X POST "repos/$REPO/actions/workflows/marketing.yml/dispatches" -f ref=main -f "inputs[acao]=$A" || echo "::warning::falhou marketing $A"
          done
          for WF in $ANA; do
            echo "▶️  $WF (ana)"
            gh api -X POST "repos/$REPO/actions/workflows/$WF/dispatches" -f ref=main -f "inputs[perfil]=ana" || echo "::warning::falhou $WF (ana)"
          done
