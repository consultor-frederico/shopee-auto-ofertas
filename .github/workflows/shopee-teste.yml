name: 14 - Testar recursos da Shopee

on:
  workflow_dispatch:
    inputs:
      termos:
        description: "Busca livre (termos separados por vírgula). Vazio = teste completo"
        default: ""
      paginas:
        description: "Busca livre: quantas páginas de 50 por termo"
        default: "1"

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Testar API da Shopee
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TERMOS: ${{ inputs.termos }}
          PAGINAS: ${{ inputs.paginas }}
        run: |
          mkdir -p data/relatorios
          python -u -m src.teste_shopee 2>&1 | tee data/relatorios/teste_shopee.txt
      - name: Salvar relatório
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/relatorios
          git diff --cached --quiet && exit 0
          git commit -m "🧪 Teste da API da Shopee"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
