name: 25 - Medição do Instagram (só leitura)

# Lê alcance, visitas e desempenho dos posts das contas Garimpo VIP e Ana, e manda o resumo
# no seu Telegram privado. Não posta nada.
on:
  workflow_dispatch:
    inputs:
      posts:
        description: 'Quantos posts medir (acima de 10, o log mostra todos e a média por formato)'
        default: '10'

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Medir e mandar no Telegram privado
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
          METRICAS_POSTS: ${{ inputs.posts || '10' }}
        run: python -m src.metricas
