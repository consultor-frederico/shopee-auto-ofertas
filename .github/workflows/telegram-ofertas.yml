name: 6 - Ofertas no Telegram

on:
  workflow_dispatch:

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre o estado mais recente (não o do momento do disparo)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Enviar ofertas ao canal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_ATIVO: ${{ vars.AWIN_ATIVO || '0' }}   # 1 liga a Shark Ninja; em Settings → Variables dá para desligar de novo
        run: python -m src.telegram_ofertas

      - name: Salvar fila
        if: always()
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fila.json
          git diff --cached --quiet && exit 0
          git commit -m "📣 Telegram $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
