name: 7 - Campanhas e cupons no Telegram

on:
  schedule:
    # Brasília: 00:13 (campanhas que começam à meia-noite), 08:13, 12:13, 18:13
    - cron: '13 3 * * *'
    - cron: '13 11 * * *'
    - cron: '13 15 * * *'
    - cron: '13 21 * * *'
  workflow_dispatch:

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Procurar campanhas novas
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.campanhas
      - name: Salvar registro
        if: always()
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/campanhas.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "🎟️ Campanhas $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
