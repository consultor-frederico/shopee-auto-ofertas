name: 17 - Kit do Canal do WhatsApp

on:
  workflow_dispatch:
    inputs:
      oferta:
        description: 'Reenviar uma oferta específica (número da fila)'
        required: false
      teste:
        description: 'Teste: envia 1 oferta sem a análise do canal'
        type: boolean
        default: false

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre o estado mais recente (não o do momento do disparo)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar ofertas para o WhatsApp
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
          WHATSAPP_TESTE: ${{ inputs.teste && '1' || '0' }}
          WHATSAPP_OFERTA: ${{ inputs.oferta }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}   # confere preço/estoque das marcas (Arno, Shark) antes de mandar
        run: python -m src.whatsapp_kit

      - name: Salvar fila
        if: always()
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fila.json
          [ -d data/zap ] && git add data/zap
          git diff --cached --quiet && exit 0
          git commit -m "📲 WhatsApp $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
