name: 10 - Testar AliExpress

on:
  workflow_dispatch:
    inputs:
      palavra:
        description: 'Palavra-chave para testar'
        default: 'fone bluetooth'
      livre:
        description: 'Busca livre (vários termos por vírgula, sem filtro de entrega)'
        type: boolean
        default: false
      filtro:
        description: 'Busca livre: só mostra títulos com uma destas palavras (vírgula)'
        default: ''

permissions:
  contents: read   # 08/11/2026 (segurança): só leitura, este workflow não grava no repo

env:
  DADOS_CHAVE: ${{ secrets.DADOS_CHAVE }}   # 08/11/2026: tranca os dados de seguidores (src/cofre.py)

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Buscar na AliExpress
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          LIVRE: ${{ inputs.livre && '1' || '' }}
          FILTRO: ${{ inputs.filtro }}
        run: python -m src.aliexpress "${{ inputs.palavra }}"
