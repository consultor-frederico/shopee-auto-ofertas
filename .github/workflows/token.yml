name: 4 - Renovar token do Instagram

run-name: 4 - Renovar token do Instagram (${{ inputs.perfil || 'garimpo' }})

on:
  workflow_dispatch:
    inputs:
      perfil:
        description: 'Conta do Instagram'
        type: choice
        options: [garimpo, ana]
        default: garimpo

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Renovar token
        env:
          PERFIL: ${{ inputs.perfil || 'garimpo' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
        run: python -m src.renovar_token

      - name: Atualizar segredo do token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SEGREDO: ${{ (inputs.perfil || 'garimpo') == 'ana' && 'IG_ACCESS_TOKEN_ANA' || 'IG_ACCESS_TOKEN' }}
        run: |
          [ -f "$RUNNER_TEMP/ig_token.txt" ] || exit 0
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Segredo GH_PAT ausente: o token foi renovado mas não pôde ser salvo. Cadastre o GH_PAT."
            exit 0
          fi
          gh secret set "$SEGREDO" -R "${{ github.repository }}" < "$RUNNER_TEMP/ig_token.txt"
          echo "✅ Segredo atualizado."
