name: 3 - Responder EU QUERO

on:
  workflow_dispatch:

concurrency:
  group: responder          # fila própria: não espera atrás de post/garimpo
  cancel-in-progress: false

env:
  DADOS_CHAVE: ${{ secrets.DADOS_CHAVE }}   # 08/11/2026: tranca os dados de seguidores (src/cofre.py)

jobs:
  responder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre o estado mais recente (não o do momento do disparo)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Enviar links no direct (todas as contas ao mesmo tempo)
        env:
          TOKEN_GARIMPO: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}      # Busca do Zé em todas as lojas (04/11/2026)
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_ATIVO: ${{ vars.AWIN_ATIVO || '1' }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}          # sem ML_REFRESH_TOKEN de propósito: a busca entra com
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}  # ID + chave (Client Credentials) e não gira o token do garimpo
          ML_ATIVO: ${{ vars.ML_ATIVO || '1' }}
          BUSCA_FOTO_ATIVO: ${{ vars.BUSCA_FOTO_ATIVO || '0' }}   # 📸 foto no direct → 3 parecidos (12/11/2026)
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
        run: |
          PERFIL=garimpo IG_ACCESS_TOKEN="$TOKEN_GARIMPO" python -m src.responder & P1=$!
          PERFIL=ana IG_ACCESS_TOKEN_ANA="$TOKEN_ANA" python -m src.responder & P2=$!
          OK=0
          wait $P1 || OK=1
          wait $P2 || OK=1
          exit $OK

      - name: Salvar respondidos
        if: always()
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "📩 Respostas $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
