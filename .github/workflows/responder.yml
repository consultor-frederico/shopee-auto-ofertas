name: 3 - Responder EU QUERO

on:
  workflow_dispatch:

concurrency:
  group: responder          # fila própria: não espera atrás de post/garimpo
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests

      - name: Enviar links no direct
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.responder

      - name: Salvar respondidos
        if: always()
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/respondidos.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "📩 Respostas $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
