name: 22 - Aprovações pelo Telegram

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  aprovar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Ler aprovações do Telegram privado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}           # resposta de direct pelo Telegram
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
        run: python -m src.aprovacao

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "✅ Aprovações $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
