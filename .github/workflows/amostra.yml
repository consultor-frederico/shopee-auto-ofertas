name: 9 - Amostra para calibrar filtros
on: workflow_dispatch
concurrency:
  group: grava-repositorio
  cancel-in-progress: false
jobs:
  amostra:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: python -m src.amostra
      - run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amostra.csv
          git commit -m "Amostra para calibrar filtros"
          git pull --rebase
          git push
