name: 1 - Garimpo de ofertas

run-name: 1 - Garimpo de ofertas (${{ inputs.perfil || 'garimpo' }})

on:
  workflow_dispatch:
    inputs:
      perfil:
        description: 'Conta do Instagram'
        type: choice
        options: [garimpo, ana]
        default: garimpo

# Impede que dois robôs gravem no repositório ao mesmo tempo
concurrency:
  group: grava-repositorio
  cancel-in-progress: false

env:
  DADOS_CHAVE: ${{ secrets.DADOS_CHAVE }}   # 08/11/2026: tranca os dados de seguidores (src/cofre.py)

jobs:
  garimpar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PERFIL: ${{ inputs.perfil || 'garimpo' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre o estado mais recente (não o do momento do disparo)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Garimpar ofertas
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}          # radar de virais (só leitura)
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # radar: IA olha as fotos dos carrosséis (opcional)
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_ATIVO: ${{ vars.AWIN_ATIVO || '1' }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}          # Mercado Livre (04/11/2026); desligar: variável ML_ATIVO = 0
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_ATIVO: ${{ vars.ML_ATIVO || '1' }}   # Shark Ninja ligada; para desligar: Settings → Secrets and variables → Actions → Variables → AWIN_ATIVO = 0
          LINHAS: ${{ vars.LINHAS || '1' }}   # 🗂️ linhas temáticas (src/linhas.py), ligadas 04/11/2026 (ok do Fred). Desligar: variável LINHAS = 0
          CAMADAS: ${{ vars.CAMADAS || '1' }}   # ⭐/🏷️ especiais + conhecidos (src/camadas.py). Desligar: variável CAMADAS = 0
        run: |
          # relatório da rodada salvo no repositório (para conferir o que a busca profunda achou)
          set -o pipefail
          mkdir -p data/relatorios
          python -u -m src.garimpar 2>&1 | tee "data/relatorios/garimpo_${PERFIL}.txt"

      - name: Salvar o token novo do Mercado Livre (o antigo só vale uma vez)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -f "$RUNNER_TEMP/ml_refresh.txt" ] || exit 0
          for i in 1 2 3; do
            gh secret set ML_REFRESH_TOKEN -R "${{ github.repository }}" < "$RUNNER_TEMP/ml_refresh.txt" && exit 0
            sleep 5
          done
          echo "::error::Não salvei o ML_REFRESH_TOKEN novo: rode o workflow 29 para conectar o Mercado Livre de novo."

      - name: Salvar fila
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "🤖 Garimpo $PERFIL $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
