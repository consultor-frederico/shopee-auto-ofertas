name: 28 - Kit do Zé (carrossel temático)
run-name: 28 - Kit do Zé (${{ inputs.tema || 'tema da vez' }}${{ inputs.so_previa && ' - prévia' || '' }})

# Carrossel temático (src/kits.py): capa com o tema ("Banheiro organizado", "Amigo secreto até R$ 50"...), 4 ou 5
# produtos buscados na hora para o tema (QUERO N) e o slide final. Só Garimpo VIP por enquanto.
on:
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema (vazio = o da vez; na prévia, "todos" testa todos)'
        default: ''
      so_previa:
        description: 'Só gerar a prévia (não posta; os slides ficam em data/relatorios/kits)'
        type: boolean
        default: false

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  kit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      PERFIL: garimpo
      TEMA: ${{ inputs.tema }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Prévia (não posta)
        if: inputs.so_previa
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.kits previa $TEMA

      - name: Preparar o carrossel
        id: prep
        if: ${{ !inputs.so_previa }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m src.kits preparar $TEMA

      - name: Sem kit hoje → carrossel normal no lugar
        if: ${{ !inputs.so_previa && steps.prep.outputs.tem_post != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/achados.yml/dispatches" -f ref=main

      - name: Enviar mídia ao GitHub Pages
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar o site
        id: deploy
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true   # às vezes o GitHub ainda não "enxerga" o pacote recém-enviado
      - name: Esperar e tentar de novo
        if: (steps.prep.outputs.tem_post == 'true') && steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: (steps.prep.outputs.tem_post == 'true') && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Publicar o carrossel no Instagram
        if: steps.prep.outputs.tem_post == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
          # kit do TikTok (slides + legenda) no Telegram privado do Fred (src/tiktok_kit.py)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
          # TikTok pela API (src/tiktok.py): desligado até o Fred cadastrar os 3 segredos (workflow 25)
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODO: ${{ vars.TIKTOK_MODO || 'rascunho' }}
          # o mesmo kit vai para a Página do Facebook (YouTube fica de fora: kit não tem vídeo)
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python -m src.kits publicar

      - name: Guardar o token novo do TikTok
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -f "$RUNNER_TEMP/tiktok_refresh.txt" ] && [ -n "$GH_TOKEN" ] || exit 0
          gh secret set TIKTOK_REFRESH_TOKEN -R "${{ github.repository }}" < "$RUNNER_TEMP/tiktok_refresh.txt"

      - name: Salvar
        if: always()
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "🧺 Kit do Zé${TEMA:+ ($TEMA)} $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
