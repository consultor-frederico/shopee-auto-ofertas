name: 12 - Apagar posts antigos

# Apaga do Instagram e da página do Facebook as ofertas postadas há mais de 15 dias
# (preço velho confunde). DESLIGADA da agenda em 12/10/2026 — só roda se for disparada à mão.
on:
  workflow_dispatch:
    inputs:
      teste:
        description: 'Só mostrar o que seria apagado (não apaga)'
        type: boolean
        default: false

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  limpar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Apagar posts com mais de 15 dias
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.teste && '1' || '0' }}
        run: python -m src.limpeza
      - name: Salvar fila
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "🗑️ Limpeza de posts antigos $(TZ=America/Sao_Paulo date +'%d/%m/%Y')"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
