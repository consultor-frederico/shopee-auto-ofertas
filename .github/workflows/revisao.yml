name: 22 - Revisão semanal (sexta 17h)

# Disparado pelo relógio (agenda.yml) toda sexta às 17h. Confere rodadas da semana, código,
# Instagram e fila, e manda o resumo no Telegram privado do Fred.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Revisar e avisar no Telegram
        env:
          GH_TOKEN: ${{ github.token }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
        run: python -m src.revisao
