name: 2 - Postar no Instagram

on:
  workflow_dispatch:
    inputs:
      formato:
        description: 'Formato do post'
        type: choice
        options: [auto, foto, reels]
        default: auto

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar mídia
        id: prep
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORMATO: ${{ github.event.inputs.formato != 'auto' && github.event.inputs.formato || '' }}
        run: python -m src.postar preparar

      - name: Enviar mídia ao GitHub Pages
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar o site
        id: deploy
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/deploy-pages@v4

      - name: Publicar no Instagram
        if: steps.prep.outputs.tem_post == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.postar publicar

      - name: Salvar fila
        if: always() && steps.prep.outcome == 'success'
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/fila.json videos
          git diff --cached --quiet && exit 0
          git commit -m "📸 Post $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
