name: 2 - Postar no Instagram
run-name: 2 - Postar no Instagram (${{ inputs.perfil || 'garimpo' }})

on:
  workflow_dispatch:
    inputs:
      formato:
        description: 'Formato do post'
        type: choice
        options: [auto, foto, reels]
        default: auto
      oferta_id:
        description: 'Código de uma oferta da fila (opcional, para teste)'
        required: false
        default: ''
      perfil:
        description: 'Conta do Instagram'
        type: choice
        options: [garimpo, ana]
        default: garimpo

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      PERFIL: ${{ inputs.perfil || 'garimpo' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre o estado mais recente (não o do momento do disparo)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Preparar mídia
        id: prep
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORMATO: ${{ github.event.inputs.formato != 'auto' && github.event.inputs.formato || '' }}
          OFERTA_ID: ${{ inputs.oferta_id }}
        run: python -m src.postar preparar

      - name: Enviar mídia ao GitHub Pages
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar o site
        id: deploy
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/deploy-pages@v4

      - name: Publicar no Instagram
        if: steps.prep.outputs.tem_post == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.postar publicar

      - name: Salvar fila
        if: always() && steps.prep.outcome == 'success'
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data videos
          git diff --cached --quiet && exit 0
          git commit -m "📸 Post $PERFIL $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          git pull --rebase
          git push
