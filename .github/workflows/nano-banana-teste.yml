name: 29 - Testar Nano Banana (prévia, não posta)

on:
  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo de imagem (vazio = o que a chave enxergar)"
        default: ""

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Gerar prévia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NANO_BANANA_MODELO: ${{ inputs.modelo }}
        run: python -u -m src.nano_banana_teste
      - uses: actions/upload-artifact@v4
        with:
          name: previa-nano-banana
          path: previa_nano
          if-no-files-found: ignore
