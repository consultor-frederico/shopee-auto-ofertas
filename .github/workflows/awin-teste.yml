name: 13 - Testar marcas da Awin (Shark Ninja, Arno)

# Baixa o feed da Awin e mostra o que o robô entenderia de cada produto (categoria, preço, link) e,
# no fim, uma prévia da legenda e da arte de 1 produto de cada marca, em cada conta. Para a Arno (feed parado),
# compara o preço do feed com o da loja hoje. Não grava nada e não posta nada.
# O endereço do feed (que tem a chave) nunca aparece no log.

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # só para guardar os exemplos na branch previa-shark (a main não é alterada)
    env:
      AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ler o feed das marcas
        run: python -m src.awin
      - name: Prévia Garimpo VIP
        env:
          PERFIL: garimpo
        run: python -m src.awin --previa --salvar /tmp/previa
      - name: Prévia Ana Novo Achados
        env:
          PERFIL: ana
        run: python -m src.awin --previa --salvar /tmp/previa
      - name: Guardar exemplos na branch previa-shark
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan previa-shark
          git rm -rf -q . 2>/dev/null || true
          cp /tmp/previa/* . 2>/dev/null || { echo "sem exemplos para guardar"; exit 0; }
          git add -A
          git commit -q -m "Exemplos de posts da Shark Ninja"
          git push -f origin previa-shark
