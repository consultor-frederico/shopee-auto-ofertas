name: 13 - Testar Shark Ninja (Awin)

# Baixa o feed da Awin e mostra o que o robô entenderia de cada produto (categoria, preço, foto, link).
# Não grava nada e não posta nada. O endereço do feed (que tem a chave) nunca aparece no log.

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Ler o feed da Shark Ninja
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: python -m src.awin
