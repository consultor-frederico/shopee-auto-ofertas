name: 9 - Post do Zé Garimpo (todo dia)

# A agenda toca todo dia às 13:30; desde 27/10/2026 o Zé posta todo dia (variável ZE_DIAS).
# Rodando à mão com "forçar", posta na hora.
on:
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Postar agora, mesmo fora dos dias do Zé'
        type: boolean
        default: false
      perfil:
        description: 'Conta do Instagram'
        type: choice
        options: [garimpo, ana]
        default: garimpo
      sem_facebook:
        description: 'Não postar na página do Facebook'
        type: boolean
        default: false

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  ze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      PERFIL: ${{ inputs.perfil || 'garimpo' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Escolher o vídeo do Zé
        id: prep
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
          FORCAR: ${{ inputs.forcar && '1' || '0' }}
        run: python -m src.ze preparar
      - if: steps.prep.outputs.tem_post == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.prep.outputs.tem_post == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true   # às vezes o GitHub ainda não "enxerga" o pacote recém-enviado
      - name: Esperar e tentar publicar de novo
        if: (steps.prep.outputs.tem_post == 'true') && steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: (steps.prep.outputs.tem_post == 'true') && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Publicar
        if: steps.prep.outputs.tem_post == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
          FB_PAGE_ID: ${{ !inputs.sem_facebook && secrets.FB_PAGE_ID || '' }}
          FB_PAGE_TOKEN: ${{ !inputs.sem_facebook && secrets.FB_PAGE_TOKEN || '' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.ze publicar
      - name: Salvar registro
        if: always() && steps.prep.outcome == 'success'
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "🎬 Post próprio ($PERFIL) $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
