name: 24 - Mandar direct (manual)

on:
  workflow_dispatch:
    inputs:
      perfil:
        description: 'Conta (garimpo ou ana)'
        default: 'garimpo'
      para:
        description: '@ ou parte do nome da pessoa (precisa ter conversa recente)'
        required: true
      texto:
        description: 'Mensagem (vazio = só procura, não manda)'
        required: false
      ler_foto:
        description: 'Só ler a foto que a pessoa mandou (descreve o produto no log, não manda nada)'
        type: boolean
        default: false

permissions:
  contents: read   # 08/11/2026 (segurança): só leitura, este workflow não grava no repo

env:
  DADOS_CHAVE: ${{ secrets.DADOS_CHAVE }}   # 08/11/2026: tranca os dados de seguidores (src/cofre.py)

jobs:
  mandar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests pillow

      - name: Mandar no direct
        env:
          PERFIL: ${{ inputs.perfil }}
          PARA: ${{ inputs.para }}
          TEXTO: ${{ inputs.texto }}
          LER_FOTO: ${{ inputs.ler_foto }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_ANA: ${{ secrets.IG_ACCESS_TOKEN_ANA }}
        run: python -m src.direct_manual
