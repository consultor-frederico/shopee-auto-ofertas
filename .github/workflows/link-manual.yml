name: 23 - Link manual da Shopee

on:
  workflow_dispatch:
    inputs:
      link:
        description: 'Link do produto da Shopee'
        required: true

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar link de afiliado e mandar no Telegram privado
        env:
          LINK: ${{ inputs.link }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_PRIVADO: ${{ secrets.TELEGRAM_CHAT_PRIVADO }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: python -m src.link_manual

      - name: Salvar fila
        if: always()
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "🛍️ Link manual $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
