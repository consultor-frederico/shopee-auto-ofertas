name: 19 - Testar Busca do Zé

on:
  workflow_dispatch:
    inputs:
      termos:
        description: "Buscas separadas por vírgula"
        default: "celular, fone bluetooth, air fryer, tênis masculino, panela de pressão"
      enviar_para:
        description: "(opcional) @ de quem buscou no direct: manda a 1ª busca para essa pessoa de verdade"
        required: false
        default: ""
      intro:
        description: "(opcional) mensagem antes dos achados, no envio de verdade"
        required: false
        default: ""

concurrency:
  group: grava-repositorio
  cancel-in-progress: false

env:
  DADOS_CHAVE: ${{ secrets.DADOS_CHAVE }}   # 08/11/2026: tranca os dados de seguidores (src/cofre.py)

jobs:
  testar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Testar buscas
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}      # Busca do Zé em todas as lojas (04/11/2026)
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_ATIVO: ${{ vars.AWIN_ATIVO || '1' }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}          # sem ML_REFRESH_TOKEN de propósito: a busca entra com
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}  # ID + chave (Client Credentials) e não gira o token do garimpo
          ML_ATIVO: ${{ vars.ML_ATIVO || '1' }}
          TERMOS: ${{ inputs.termos }}
        run: |
          mkdir -p data/relatorios
          if [ "$TERMOS" = "revisar" ]; then python -u -m src.busca_ze revisar 7; else IFS=, read -ra T <<< "$TERMOS"; python -u -m src.busca_ze "${T[@]}"; fi 2>&1 | tee data/relatorios/teste_busca.txt
      - name: Mandar os achados de verdade (só se tiver @)
        if: inputs.enviar_para != ''
        env:
          PERFIL: garimpo
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}      # Busca do Zé em todas as lojas (04/11/2026)
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
          AWIN_ATIVO: ${{ vars.AWIN_ATIVO || '1' }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}          # sem ML_REFRESH_TOKEN de propósito: a busca entra com
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}  # ID + chave (Client Credentials) e não gira o token do garimpo
          ML_ATIVO: ${{ vars.ML_ATIVO || '1' }}
          PARA: ${{ inputs.enviar_para }}
          TERMOS: ${{ inputs.termos }}
          INTRO: ${{ inputs.intro }}
        run: python -u -m src.busca_ze enviar "$PARA" "${TERMOS%%,*}" "$INTRO"
      - name: Salvar relatório
        run: |
          git config user.name "GarimpoBot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/relatorios data/busca_ze.json
          git diff --cached --quiet && exit 0
          git commit -m "🧪 Teste da Busca do Zé"
          # outro workflow pode ter salvo junto: tenta de novo até 5 vezes
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            [ $i = 5 ] && exit 1
            sleep $((i * 5))
          done
